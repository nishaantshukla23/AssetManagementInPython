<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Create Asset</title>
		<style>
			body { font-family: Arial, sans-serif; margin: 24px; }
			.container { max-width: 640px; margin: 0 auto; }
			label { display:block; margin-top:12px; font-weight:600 }
			input[type="text"], select { width:100%; padding:8px; box-sizing:border-box; margin-top:6px }
			.actions { margin-top:16px }
			.btn { padding:8px 14px; border:none; background:#1976d2; color:white; cursor:pointer; border-radius:4px }
			.btn.secondary { background:#6c757d }
			.error { color:#b00020; margin-top:6px }
		</style>
	</head>
	<body>
{% extends 'base.html' %}

{% block title %}Create Asset{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body">
      <h3>Create Asset</h3>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post" action="{% url 'create_asset' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Asset name</label>
          <input class="form-control" name="name" required placeholder="e.g. Laptop - Dell XPS 13">
        </div>
        <div class="mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" name="status" required>
            <option value="new">New</option>
            <option value="in_use">In use</option>
            <option value="maintenance">Maintenance</option>
            <option value="retired">Retired</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" name="description" rows="3"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Create asset</button>
          <a class="btn btn-secondary" href="{% url 'list_assets' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
	</body>
</html>

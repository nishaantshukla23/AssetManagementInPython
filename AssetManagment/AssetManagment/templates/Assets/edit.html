{% extends 'base.html' %}

{% block title %}Edit Asset{% endblock %}

{% block content %}
	<div class="card">
		<div class="card-body">
			<h3>Update Asset</h3>
			{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
			<form method="post" action="">
				{% csrf_token %}
				<div class="mb-3">
					<label class="form-label">Asset name</label>
					<input class="form-control" name="name" value="{{ asset.asset_name|default_if_none:'' }}" required />
				</div>
				<div class="mb-3">
					<label class="form-label">Status</label>
					<select class="form-select" name="status" required>
						<option value="new" {% if asset.asset_status == 'new' %}selected{% endif %}>New</option>
						<option value="in_use" {% if asset.asset_status == 'in_use' %}selected{% endif %}>In use</option>
						<option value="maintenance" {% if asset.asset_status == 'maintenance' %}selected{% endif %}>Maintenance</option>
						<option value="retired" {% if asset.asset_status == 'retired' %}selected{% endif %}>Retired</option>
					</select>
				</div>
				<div class="d-flex gap-2">
					<button class="btn btn-primary" type="submit">Update asset</button>
					<a class="btn btn-secondary" href="{% url 'view_asset' asset.asset_id %}">Cancel</a>
				</div>
			</form>
		</div>
	</div>
{% endblock %}

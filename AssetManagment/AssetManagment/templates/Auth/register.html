{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="card">
  <div class="card-body">
    <h4>Create an account</h4>
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" value="{{ username|default:'' }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email" value="{{ email|default:'' }}" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" name="password2" required />
      </div>
      <button class="btn btn-primary" type="submit">Register</button>
      <a class="btn btn-link" href="{% url 'login' %}">Already have an account? Login</a>
    </form>
  </div>
</div>
{% endblock %}
